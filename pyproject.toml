[tool.pytest.ini_options]
pythonpath = ["server", "worker", "scenario"]
testpaths = ["server/tests", "scenario/tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["api", "worker", "mockbank"]
