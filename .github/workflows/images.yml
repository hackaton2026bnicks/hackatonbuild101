name: Images

# On pull requests, make sure every image still builds. The deploy workflow builds and pushes on main.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: |
          docker build -t build101-api server
          docker build -t build101-worker worker
          docker build -t build101-mockbank scenario
