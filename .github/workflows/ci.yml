name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r server/requirements.txt -r scenario/requirements.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Check shell scripts
        run: bash -n infra/*.sh

  images:
    # On pull requests, make sure every image still builds. The deploy workflow builds and pushes on main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t build101-api server
          docker build -t build101-worker worker
          docker build -t build101-mockbank scenario
