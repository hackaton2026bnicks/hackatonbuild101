name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: build101
          POSTGRES_PASSWORD: test
          POSTGRES_DB: build101
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U build101 -d build101"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://build101:test@localhost:5432/build101
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r server/requirements.txt -r scenario/requirements.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Check shell scripts
        run: bash -n infra/*.sh
